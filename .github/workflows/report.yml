name: report
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the file report.txt
        run: |
          echo "build report" > report.txt
          date >> report.txt
          uname -a >> report.txt
      - name: Upload the report
        uses: actions/upload/actifact@v4
        with:
          name: build-report
          path: report.txt
          rentention-days: 5
